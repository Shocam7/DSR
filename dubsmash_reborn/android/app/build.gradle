plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" apply false  // applied per-flavor in staging/prod
    id "com.google.firebase.crashlytics" apply false
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.dubsmash.dubsmash_reborn"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Support 16 KB page size (required for Play Store — verify current requirements).
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // Pack .tflite without compression — critical for model loading speed/memory.
    androidResources {
        noCompress += ['.tflite']
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // release signing is injected by CI via environment variables
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Flavors: dev (mock server, debug HUD), staging, prod.
    flavorDimensions += "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.dubsmash.dubsmash_reborn.dev"
            resValue "string", "app_name", "DSR Dev"
            buildConfigField "String", "MOCK_SERVER_URL", '"http://10.0.2.2:8080"'
            buildConfigField "boolean", "DEBUG_HUD", "true"
        }
        staging {
            dimension "environment"
            applicationId "com.dubsmash.dubsmash_reborn.staging"
            resValue "string", "app_name", "DSR Staging"
            buildConfigField "String", "MOCK_SERVER_URL", '""'
            buildConfigField "boolean", "DEBUG_HUD", "true"
            apply plugin: "com.google.gms.google-services"
            apply plugin: "com.google.firebase.crashlytics"
        }
        prod {
            dimension "environment"
            applicationId "com.dubsmash.dubsmash_reborn"
            resValue "string", "app_name", "DubSmash Reborn"
            buildConfigField "String", "MOCK_SERVER_URL", '""'
            buildConfigField "boolean", "DEBUG_HUD", "false"
            apply plugin: "com.google.gms.google-services"
            apply plugin: "com.google.firebase.crashlytics"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}

afterEvaluate {
    tasks.matching { it.name.contains("Dev") && (it.name.contains("GoogleServices") || it.name.contains("Crashlytics")) }.configureEach {
        enabled = false
    }
}
