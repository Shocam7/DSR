name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  # ─── Dart / Flutter analysis & tests ───────────────────────────────────────
  dart_analysis:
    name: Dart Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Pigeon
        run: dart run pigeon --input packages/dsr_engine/pigeons/engine.dart

      - name: Static analysis (zero warnings)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Dart tests
        run: flutter test --coverage

  # ─── Native (Kotlin) unit tests ────────────────────────────────────────────
  kotlin_tests:
    name: Kotlin Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter (needed for Pigeon-generated Kotlin)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Pigeon code
        run: dart run pigeon --input packages/dsr_engine/pigeons/engine.dart

      - name: Run Kotlin unit tests
        run: |
          cd android
          ./gradlew :dsr_engine:testDebugUnitTest

  # ─── Build APK ─────────────────────────────────────────────────────────────
  build_apk:
    name: Build APK (dev flavor)
    runs-on: ubuntu-latest
    needs: [dart_analysis, kotlin_tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Pigeon
        run: dart run pigeon --input packages/dsr_engine/pigeons/engine.dart

      - name: Build dev APK
        run: flutter build apk --flavor dev --dart-define=APP_FLAVOR=dev --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
