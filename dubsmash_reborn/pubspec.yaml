name: dubsmash_reborn
description: Dub songs and dialogues — your room becomes the cinematic universe.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  dio: ^5.4.3+1
  drift: ^2.18.0
  dsr_engine:
    path: packages/dsr_engine
  file_picker: ^11.0.3
  firebase_core: ^3.1.1
  firebase_crashlytics: ^4.0.4
  firebase_remote_config: ^5.0.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^2.4.4
  go_router: ^14.2.7
  json_annotation: ^4.9.0
  logger: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  sqlite3_flutter_libs: ^0.5.24
  video_player: ^2.14.0

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  pigeon: ^22.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/audio/
    - assets/config/
    - assets/themes/base_look/
    - assets/themes/base_look/textures/
    - assets/themes/medieval_stone/
    - assets/themes/medieval_stone/textures/
    - assets/themes/cyberpunk_neon/
    - assets/themes/cyberpunk_neon/textures/

  # Flavors are configured in android/app/build.gradle
